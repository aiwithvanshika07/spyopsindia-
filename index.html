        <!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Spy Mission Pro</title>

<style>
body { margin:0; overflow:hidden; font-family:Arial; }
canvas { display:block; }

#startScreen {
  position:absolute;
  width:100%; height:100%;
  background:black;
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
}

button {
  padding:10px 20px;
  font-size:18px;
}

#ui {
  position:absolute;
  top:10px; left:10px;
  color:white;
}

#controls {
  position:absolute;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
}

.btn {
  width:60px; height:60px;
  background:#222;
  color:white;
  border-radius:50%;
  text-align:center;
  line-height:60px;
  margin:5px;
  display:inline-block;
}
</style>

</head>
<body>

<div id="startScreen">
  <h1>🕵️ Spy Mission</h1>
  <button onclick="startGame()">Start Mission</button>
</div>

<div id="ui"></div>
<canvas id="game"></canvas>

<div id="controls">
  <div><span class="btn" onclick="move('up')">↑</span></div>
  <div>
    <span class="btn" onclick="move('left')">←</span>
    <span class="btn" onclick="move('down')">↓</span>
    <span class="btn" onclick="move('right')">→</span>
  </div>
  <div><span class="btn" onclick="shoot()">🔥</span></div>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let player, enemies, bullets, effects;
let health, score, running;

const bg = new Image();
bg.src = "https://images.unsplash.com/photo-1500530855697-b586d89ba3ee";

function startGame(){
  document.getElementById("startScreen").style.display="none";

  player = {x:200,y:300,size:15};
  enemies = [];
  bullets = [];
  effects = [];

  health = 100;
  score = 0;
  running = true;

  spawnEnemies();
  update();
}

function spawnEnemies(){
  setInterval(()=>{
    if(!running) return;

    enemies.push({
      x:Math.random()*canvas.width,
      y:Math.random()*canvas.height/2,
      size:15,
      state:"patrol",
      dir:Math.random()*2-1
    });

  },1500);
}

function move(d){
  if(d=="up") player.y-=20;
  if(d=="down") player.y+=20;
  if(d=="left") player.x-=20;
  if(d=="right") player.x+=20;
}

function shoot(){
  bullets.push({x:player.x,y:player.y});
}

function update(){
  if(!running) return;

  ctx.drawImage(bg,0,0,canvas.width,canvas.height);

  // player
  ctx.fillStyle="cyan";
  ctx.beginPath();
  ctx.arc(player.x,player.y,player.size,0,Math.PI*2);
  ctx.fill();

  // bullets
  bullets.forEach((b,i)=>{
    b.y -= 10;
    ctx.strokeStyle="yellow";
    ctx.beginPath();
    ctx.moveTo(b.x,b.y);
    ctx.lineTo(b.x,b.y+10);
    ctx.stroke();
  });

  // enemies
  enemies.forEach((e,ei)=>{

    let dx = player.x - e.x;
    let dy = player.y - e.y;
    let dist = Math.sqrt(dx*dx + dy*dy);

    // AI
    if(dist < 150){
      e.x += dx/dist * 2;
      e.y += dy/dist * 2;
    } else {
      e.x += e.dir * 1;
    }

    ctx.fillStyle="red";
    ctx.beginPath();
    ctx.arc(e.x,e.y,e.size,0,Math.PI*2);
    ctx.fill();

    // hit player
    if(dist < e.size + player.size){
      health -= 5;
      effects.push({x:e.x,y:e.y,time:10});
    }

    // bullet hit
    bullets.forEach((b,bi)=>{
      let dx = e.x - b.x;
      let dy = e.y - b.y;
      let dist = Math.sqrt(dx*dx + dy*dy);

      if(dist < e.size){
        enemies.splice(ei,1);
        bullets.splice(bi,1);
        score++;
        effects.push({x:e.x,y:e.y,time:15});
      }
    });
  });

  // effects (explosion)
  effects.forEach((fx,i)=>{
    ctx.fillStyle="orange";
    ctx.beginPath();
    ctx.arc(fx.x,fx.y,fx.time,0,Math.PI*2);
    ctx.fill();
    fx.time--;
  });

  // UI
  document.getElementById("ui").innerHTML =
    "Score: "+score+"<br>Health: "+health;

  if(health<=0){
    running=false;
    alert("Mission Failed. Score: "+score);
    location.reload();
  }

  requestAnimationFrame(update);
}
</script>

</body>
</html>
