<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>SpyOpsIndia</title>

<style>
body {
  margin:0;
  overflow:hidden;
  font-family:Arial;
  font-size:14px;
  background:black;
  color:white;
}

#game {
  width:100vw;
  height:100vh;
  position:relative;
  display:none;
  background-size:cover;
  background-position:center;
}

.player,.enemy,.file{
  position:absolute;
  width:40px;
  height:40px;
  background-size:cover;
}

/* WORKING IMAGES */
.player{
  background-image:url("https://cdn-icons-png.flaticon.com/512/9131/9131529.png");
}

.enemy{
  background-image:url("https://cdn-icons-png.flaticon.com/512/147/147144.png");
}

.file{
  background:yellow;
  border-radius:50%;
}

#ui{
  position:absolute;
  top:10px;
  left:10px;
  background:rgba(0,0,0,0.6);
  padding:10px;
  border-radius:10px;
}

#cutscene, #hacking{
  position:absolute;
  width:100%;
  height:100%;
  background:black;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
}

button{
  padding:10px;
  margin-top:10px;
}

#controls{
  position:absolute;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
}

.ctrl-btn{
  padding:15px;
  margin:5px;
}
</style>
</head>

<body>

<div id="cutscene">
  <h1>🎬 Mission Briefing</h1>
  <p>You are a RAW Agent. Complete secret missions.</p>
  <button onclick="startGame()">Start Mission</button>
</div>

<div id="game">

  <div id="ui">
    Level: <span id="level">1</span> |
    Score: <span id="score">0</span><br>
    Gadgets: D (Drone) | I (Invisible) | J (Jammer)
  </div>

  <div class="player" id="player"></div>
  <div class="enemy" id="enemy"></div>
  <div class="file" id="file"></div>

  <div id="controls">
    <button class="ctrl-btn" onclick="move('up')">⬆</button><br>
    <button class="ctrl-btn" onclick="move('left')">⬅</button>
    <button class="ctrl-btn" onclick="move('down')">⬇</button>
    <button class="ctrl-btn" onclick="move('right')">➡</button>
  </div>

</div>

<div id="hacking" style="display:none;">
  <h2>💻 HACKING...</h2>
  <p>Press SPACE repeatedly!</p>
  <p id="hackProgress">0%</p>
</div>

<script>
let px=100, py=100;
let ex=400, ey=200;
let level=1, score=0;
let invisible=false;

const player=document.getElementById("player");
const enemy=document.getElementById("enemy");
const file=document.getElementById("file");

function startGame(){
  document.getElementById("cutscene").style.display="none";
  document.getElementById("game").style.display="block";
  newLevel();
  update();
}

function newLevel(){

  const game=document.getElementById("game");

  // WORKING BACKGROUNDS
  if(level==1){
    game.style.backgroundImage="url('https://images.unsplash.com/photo-1500530855697-b586d89ba3ee')";
  }
  else if(level==2){
    game.style.backgroundImage="url('https://images.unsplash.com/photo-1501785888041-af3ef285b470')";
  }
  else{
    game.style.backgroundImage="url('https://images.unsplash.com/photo-1526778548025-fa2f459cd5c1')";
  }

  px=100; py=100;
  ex=300+Math.random()*200;
  ey=200+Math.random()*200;

  file.style.left=(500+Math.random()*200)+"px";
  file.style.top=(300+Math.random()*200)+"px";
}

function update(){

  player.style.left=px+"px";
  player.style.top=py+"px";

  let dx=px-ex;
  let dy=py-ey;
  let dist=Math.hypot(dx,dy);

  if(dist<200 && !invisible){
    ex+=dx/dist*2;
    ey+=dy/dist*2;
  }

  enemy.style.left=ex+"px";
  enemy.style.top=ey+"px";

  if(dist<40 && !invisible){
    alert("❌ Mission Failed");
    location.reload();
  }

  let fx=file.offsetLeft;
  let fy=file.offsetTop;

  if(Math.hypot(px-fx,py-fy)<30){
    startHacking();
    return;
  }

  requestAnimationFrame(update);
}

document.addEventListener("keydown", e=>{
  if(e.key=="ArrowUp") py-=10;
  if(e.key=="ArrowDown") py+=10;
  if(e.key=="ArrowLeft") px-=10;
  if(e.key=="ArrowRight") px+=10;

  if(e.key=="i"){
    invisible=true;
    player.style.opacity=0.3;
    setTimeout(()=>{ invisible=false; player.style.opacity=1;},3000);
  }

  if(e.key=="d"){
    alert("📡 Enemy at: "+Math.round(ex)+","+Math.round(ey));
  }

  if(e.key=="j"){
    ex-=80; ey-=80;
  }
});

function move(dir){
  if(dir=="up") py-=10;
  if(dir=="down") py+=10;
  if(dir=="left") px-=10;
  if(dir=="right") px+=10;
}

function startHacking(){
  document.getElementById("game").style.display="none";
  document.getElementById("hacking").style.display="flex";

  let progress=0;

  function hack(e){
    if(e.code==="Space"){
      progress+=10;
      document.getElementById("hackProgress").innerText=progress+"%";

      if(progress>=100){
        document.removeEventListener("keydown", hack);
        finishLevel();
      }
    }
  }

  document.addEventListener("keydown", hack);
}

function finishLevel(){
  document.getElementById("hacking").style.display="none";
  document.getElementById("game").style.display="block";

  level++;
  score+=100;

  document.getElementById("level").innerText=level;
  document.getElementById("score").innerText=score;

  alert("✅ Mission Complete!");

  newLevel();
  update();
}
</script>

</body>
</html>
