<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Spy Ops India - Advanced</title>
<style>
body { margin:0; overflow:hidden; font-family:Arial; background:#000; }
canvas { display:block; }

#ui {
  position:absolute;
  top:10px; left:10px;
  color:white;
  font-size:16px;
}

#startScreen {
  position:absolute;
  width:100%; height:100%;
  background:black;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
}

button {
  padding:10px 20px;
  font-size:18px;
  margin-top:10px;
}

#controls {
  position:absolute;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
}

.btn {
  width:60px; height:60px;
  background:#222;
  color:white;
  border-radius:50%;
  text-align:center;
  line-height:60px;
  font-size:20px;
  margin:5px;
  display:inline-block;
}
</style>
</head>
<body>

<div id="startScreen">
  <h1>🔥 Spy Ops India</h1>
  <p>Eliminate enemies. Survive as long as possible.</p>
  <button onclick="startGame()">Start Mission</button>
</div>

<div id="ui"></div>
<canvas id="game"></canvas>

<div id="controls">
  <div><span class="btn" onclick="move('up')">↑</span></div>
  <div>
    <span class="btn" onclick="move('left')">←</span>
    <span class="btn" onclick="move('down')">↓</span>
    <span class="btn" onclick="move('right')">→</span>
  </div>
  <div><span class="btn" onclick="shoot()">🔥</span></div>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let player, bullets, enemies, score, health, level, gameRunning;

const shootSound = new Audio("https://www.soundjay.com/button/sounds/button-16.mp3");
const bgMusic = new Audio("https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3");
bgMusic.loop = true;

function startGame(){
  document.getElementById("startScreen").style.display="none";

  player = { x:200, y:300, size:15, speed:15 };
  bullets = [];
  enemies = [];
  score = 0;
  health = 100;
  level = 1;
  gameRunning = true;

  bgMusic.play();

  spawnEnemies();
  update();
}

function spawnEnemies(){
  setInterval(()=>{
    if(!gameRunning) return;
    enemies.push({
      x: Math.random()*canvas.width,
      y: Math.random()*canvas.height/2,
      size:15,
      speed:1 + level*0.5
    });
  },1200);
}

function move(dir){
  if(!gameRunning) return;
  if(dir=="up") player.y -= player.speed;
  if(dir=="down") player.y += player.speed;
  if(dir=="left") player.x -= player.speed;
  if(dir=="right") player.x += player.speed;
}

function shoot(){
  if(!gameRunning) return;
  shootSound.play();
  bullets.push({ x:player.x, y:player.y, size:4, speed:8 });
}

function update(){
  if(!gameRunning) return;

  ctx.clearRect(0,0,canvas.width,canvas.height);

  // player
  ctx.fillStyle="cyan";
  ctx.beginPath();
  ctx.arc(player.x, player.y, player.size, 0, Math.PI*2);
  ctx.fill();

  // bullets
  bullets.forEach((b,i)=>{
    b.y -= b.speed;
    ctx.fillStyle="yellow";
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.size, 0, Math.PI*2);
    ctx.fill();
  });

  // enemies AI follow player
  enemies.forEach((e,ei)=>{
    let dx = player.x - e.x;
    let dy = player.y - e.y;
    let dist = Math.sqrt(dx*dx + dy*dy);

    e.x += dx/dist * e.speed;
    e.y += dy/dist * e.speed;

    ctx.fillStyle="red";
    ctx.beginPath();
    ctx.arc(e.x, e.y, e.size, 0, Math.PI*2);
    ctx.fill();

    // hit player
    if(dist < e.size + player.size){
      health -= 10;
      enemies.splice(ei,1);
    }

    // bullet hit
    bullets.forEach((b,bi)=>{
      let dx = e.x - b.x;
      let dy = e.y - b.y;
      let dist = Math.sqrt(dx*dx + dy*dy);

      if(dist < e.size + b.size){
        enemies.splice(ei,1);
        bullets.splice(bi,1);
        score++;
      }
    });
  });

  // level system
  if(score > level*5){
    level++;
  }

  // UI
  document.getElementById("ui").innerText =
    "Score: "+score+" | Health: "+health+" | Level: "+level;

  // game over
  if(health <= 0){
    gameRunning = false;
    bgMusic.pause();
    alert("Mission Failed! Score: "+score);
    location.reload();
  }

  requestAnimationFrame(update);
}
</script>

</body>
</html>
